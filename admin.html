<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AquaVia — Analytics</title>
    <style>
      /*
       * Dark-only by design: this dashboard lives inside the AquaVia navy and is
       * only ever seen by one operator, so a theme toggle would be ceremony.
       * The series colors below are the dataviz dark categorical slots 1-4,
       * validated against this exact surface (#0a1a2f): all four clear the
       * lightness band, chroma floor, CVD separation, normal-vision floor, and
       * 3:1 contrast.
       */
      :root {
        color-scheme: dark;
        --surface-0: #04101f;
        --surface-1: #0a1a2f;
        --surface-2: #11263f;
        --border: rgba(255, 255, 255, 0.1);
        --ink: #ffffff;
        --ink-2: #b9c6d6;
        --muted: #7f90a3;
        --grid: #17293f;
        --axis: #24374f;

        --s1: #3987e5;
        --s2: #008300;
        --s3: #d55181;
        --s4: #c98500;

        --good: #0ca30c;
        --warning: #fab219;
        --serious: #ec835a;
        --critical: #d03b3b;

        --accent: #3ecfbf;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--surface-0);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      a { color: var(--accent); }

      .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 20px 80px; }

      /* ---- Header ---- */
      .head {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border);
      }
      .head h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      .head .spacer { flex: 1; }

      .pill {
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--surface-1); border: 1px solid var(--border);
        border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--ink-2);
      }
      .dot {
        width: 8px; height: 8px; border-radius: 50%; background: var(--good);
        box-shadow: 0 0 0 0 rgba(12, 163, 12, 0.6);
        animation: pulse 2s infinite;
      }
      .dot.idle { background: var(--muted); animation: none; box-shadow: none; }
      @keyframes pulse {
        0%   { box-shadow: 0 0 0 0 rgba(12, 163, 12, 0.5); }
        70%  { box-shadow: 0 0 0 8px rgba(12, 163, 12, 0); }
        100% { box-shadow: 0 0 0 0 rgba(12, 163, 12, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot { animation: none; }
      }

      /* ---- Controls ---- */
      .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
      .tab {
        background: none; border: 1px solid transparent; color: var(--muted);
        padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit;
        font-weight: 500;
      }
      .tab:hover { color: var(--ink-2); background: var(--surface-1); }
      .tab[aria-selected="true"] {
        color: var(--ink); background: var(--surface-1); border-color: var(--border);
      }
      .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .ranges { display: flex; gap: 4px; }
      .range {
        background: var(--surface-1); border: 1px solid var(--border); color: var(--muted);
        padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px;
      }
      .range[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }
      .range:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* ---- Cards & grid ---- */
      .grid { display: grid; gap: 16px; }
      .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      @media (max-width: 900px) {
        .cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .cols-3, .cols-2 { grid-template-columns: 1fr; }
      }
      @media (max-width: 520px) {
        .cols-4 { grid-template-columns: 1fr; }
      }

      .card {
        background: var(--surface-1); border: 1px solid var(--border);
        border-radius: 12px; padding: 18px;
      }
      .card h2 {
        font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 14px;
        letter-spacing: 0.02em; text-transform: uppercase;
      }
      .card .sub { font-size: 12px; color: var(--muted); margin: -8px 0 14px; text-transform: none; letter-spacing: 0; }

      /* ---- Stat tiles ---- */
      .tile-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      .tile-value { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
      .tile-note { font-size: 12px; color: var(--muted); margin-top: 6px; }

      /* ---- Tables ---- */
      .scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th {
        text-align: left; font-weight: 500; color: var(--muted); font-size: 12px;
        padding: 8px 12px 8px 0; border-bottom: 1px solid var(--border); white-space: nowrap;
      }
      td {
        padding: 9px 12px 9px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        color: var(--ink-2); vertical-align: top;
      }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; }
      tr:last-child td { border-bottom: none; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

      /* Zero-result searches: this list is a product roadmap written by buyers,
         so it gets a status color plus a label — never color alone. */
      tr.zero td { background: rgba(208, 59, 59, 0.08); }
      .badge {
        display: inline-block; padding: 1px 7px; border-radius: 999px;
        font-size: 11px; font-weight: 600; white-space: nowrap;
      }
      .badge.critical { background: rgba(208, 59, 59, 0.18); color: #ff9d9d; }
      .badge.good { background: rgba(12, 163, 12, 0.18); color: #7ee07e; }
      .badge.muted { background: rgba(255, 255, 255, 0.07); color: var(--muted); }

      /* ---- Banners ---- */
      .banner {
        display: flex; gap: 10px; align-items: flex-start;
        border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px;
        border: 1px solid;
      }
      .banner.warn { background: rgba(250, 178, 25, 0.08); border-color: rgba(250, 178, 25, 0.3); color: #ffd98a; }
      .banner.crit { background: rgba(208, 59, 59, 0.1); border-color: rgba(208, 59, 59, 0.35); color: #ffb3b3; }
      .banner strong { color: inherit; }

      /* ---- Legend ---- */
      .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; color: var(--ink-2); }
      .legend span { display: inline-flex; align-items: center; gap: 6px; }
      .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }

      /* ---- Chart bits ---- */
      .chart { position: relative; }
      .tooltip {
        position: absolute; pointer-events: none; z-index: 5;
        background: var(--surface-2); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--ink);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); white-space: nowrap;
      }
      .tooltip .t-row { display: flex; gap: 10px; justify-content: space-between; }
      .tooltip .t-head { color: var(--muted); margin-bottom: 4px; }

      .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

      /* ---- Login ---- */
      .login { max-width: 340px; margin: 15vh auto; }
      .login input {
        width: 100%; background: var(--surface-1); border: 1px solid var(--border);
        color: var(--ink); border-radius: 8px; padding: 11px 12px; font: inherit; margin-bottom: 10px;
      }
      .login input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .login button {
        width: 100%; background: var(--accent); color: #04101f; border: none;
        border-radius: 8px; padding: 11px; font: inherit; font-weight: 600; cursor: pointer;
      }
      .err { color: #ffb3b3; font-size: 13px; margin-top: 10px; }
      .sr {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.jsx"></script>
  </body>
</html>
