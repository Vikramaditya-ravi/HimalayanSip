<!DOCTYPE html>

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Everything below is duplicated by useSEO() at runtime. That duplication is
      deliberate, not an oversight.

      Each route is client-rendered: the served HTML is the shell, and until the
      bundle hydrates there is no title, no description, no canonical and no
      structured data. Googlebot renders JS so it saw the real head eventually,
      but GPTBot, ClaudeBot and PerplexityBot generally do not execute
      JavaScript — they were fetching a 661-byte empty div and indexing nothing.

      So the truth lives here where any crawler can read it on the first byte.
      useSEO() then overwrites these same nodes (it queries by selector and
      mutates in place, and the JSON-LD block is keyed by id="hs-schema"), so
      nothing is ever duplicated in the live DOM — the runtime pass just writes
      the identical values back.

      These strings must stay byte-identical to ROUTES.process in src/site/data.js.
      They are not geo-dependent: Googlebot crawls from US IPs, so anything keyed
      off the ipapi.co lookup was unindexable by construction.
    -->
    <title>How We Make It — 7-Stage Filtration & Delivery | AquaVia</title>
    <meta name="description" content="Seven-stage filtration, mineral balancing, bottling and Delhi NCR dispatch in 2–3 business days." />
    <meta name="keywords" content="7 stage filtration water, RO membrane ozonation, packaged drinking water process, cold chain water delivery Delhi" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="AquaVia" />
    <meta name="theme-color" content="#080D16" />
    <link rel="canonical" href="https://www.aquaviaworld.com/process" />

    <meta property="og:title" content="How We Make It — 7-Stage Filtration & Delivery | AquaVia" />
    <meta property="og:description" content="Seven-stage filtration, mineral balancing, bottling and Delhi NCR dispatch in 2–3 business days." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.aquaviaworld.com/process" />
    <meta property="og:image" content="https://www.aquaviaworld.com/og-cover.jpg" />
    <meta property="og:site_name" content="AquaVia" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="How We Make It — 7-Stage Filtration & Delivery | AquaVia" />
    <meta name="twitter:description" content="Seven-stage filtration, mineral balancing, bottling and Delhi NCR dispatch in 2–3 business days." />
    <meta name="twitter:image" content="https://www.aquaviaworld.com/og-cover.jpg" />
    <meta name="twitter:site" content="@AquaVia" />

    <!--
      Fonts were previously pulled in by an @import inside a JS-injected <style>
      block, so the browser did not discover them until the bundle had parsed and
      mounted — measured at ~1.67s. The preconnects were added in that same
      effect, which meant they resolved at the same moment and bought nothing.
      Static tags here put both on the critical path where they belong.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" />

    <script type="application/ld+json" id="hs-schema">
[{"@context":"https://schema.org","@type":"LocalBusiness","@id":"https://www.aquaviaworld.com/#business","name":"AquaVia","description":"Premium customized branded bottled water solutions for businesses in Delhi NCR","url":"https://www.aquaviaworld.com/","image":"https://www.aquaviaworld.com/og-cover.jpg","logo":"https://www.aquaviaworld.com/aquavia-logo.png","telephone":"+91-76248-03460","email":"info@aquaviaworld.com","priceRange":"₹₹","currenciesAccepted":"INR","paymentAccepted":"Cash, Credit Card, UPI, Bank Transfer","areaServed":{"@type":"City","name":"Delhi NCR"},"address":{"@type":"PostalAddress","addressLocality":"New Delhi","addressRegion":"Delhi","postalCode":"110001","addressCountry":"IN"},"openingHoursSpecification":[{"@type":"OpeningHoursSpecification","dayOfWeek":["Monday","Tuesday","Wednesday","Thursday","Friday"],"opens":"09:00","closes":"18:00"}],"sameAs":["https://www.instagram.com/aquavia.official?igsh=eHVmM3F3MnI2OTl0","https://www.linkedin.com/company/aquavia"]}]
    </script>
  </head>
  <body style="margin:0;padding:0;background:#080D16;">
    <div id="root">
      <!--
        Static fallback for crawlers that never run the bundle. React replaces
        this wholesale on hydration, so it is never seen by a real visitor —
        it exists so a non-rendering fetch still comes away with the business,
        the offer and the service area rather than an empty div. The links are
        what let such a crawler reach the other five routes at all.
      -->
      <noscript>
        <h1>How AquaVia Water Is Made</h1>
        <p>
          Seven sequential filtration stages: back-wash sand filter, double
          Y-strainer, CTO carbon block, sediment filter, RO membrane, activated
          carbon, and ozonation. Essential minerals are then reintroduced before
          bottling.
        </p>
        <p>

          Production and delivery run 2–3 business days across Delhi NCR.
        </p>

          <a href="/about">About</a> ·

        </p>
      </noscript>
    </div>
    <script type="module" src="/src/entries/process.jsx"></script>
