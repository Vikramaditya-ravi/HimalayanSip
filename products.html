<!DOCTYPE html>

    <!--
      Everything below is duplicated by useSEO() at runtime. That duplication is
      deliberate, not an oversight.

      Each route is client-rendered: the served HTML is the shell, and until the
      bundle hydrates there is no title, no description, no canonical and no
      structured data. Googlebot renders JS so it saw the real head eventually,
      but GPTBot, ClaudeBot and PerplexityBot generally do not execute
      JavaScript — they were fetching a 661-byte empty div and indexing nothing.

      So the truth lives here where any crawler can read it on the first byte.
      useSEO() then overwrites these same nodes (it queries by selector and
      mutates in place, and the JSON-LD block is keyed by id="hs-schema"), so
      nothing is ever duplicated in the live DOM — the runtime pass just writes
      the identical values back.

      These strings must stay byte-identical to ROUTES.products in src/site/data.js.
      They are not geo-dependent: Googlebot crawls from US IPs, so anything keyed
      off the ipapi.co lookup was unindexable by construction.
    -->
    <title>Custom Water Bottle Sizes & MOQs — 250ml, 500ml, 1L | AquaVia</title>
    <meta name="description" content="Branded water bottles in 250ml, 500ml and 1 litre. Minimum orders from 150 units. Upload your logo and preview your label before you order." />
    <meta name="keywords" content="custom water bottle sizes, 250ml branded bottle, 500ml corporate water bottle, 1 litre custom bottle, water bottle MOQ" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="AquaVia" />
    <meta name="theme-color" content="#04101f" />
    <link rel="canonical" href="https://www.aquaviaworld.com/products" />

    <meta property="og:title" content="Custom Water Bottle Sizes & MOQs — 250ml, 500ml, 1L | AquaVia" />
    <meta property="og:description" content="Branded water bottles in 250ml, 500ml and 1 litre. Minimum orders from 150 units. Upload your logo and preview your label before you order." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.aquaviaworld.com/products" />
    <meta property="og:image" content="https://www.aquaviaworld.com/og-cover.jpg" />
    <meta property="og:site_name" content="AquaVia" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Custom Water Bottle Sizes & MOQs — 250ml, 500ml, 1L | AquaVia" />
    <meta name="twitter:description" content="Branded water bottles in 250ml, 500ml and 1 litre. Minimum orders from 150 units. Upload your logo and preview your label before you order." />
    <meta name="twitter:image" content="https://www.aquaviaworld.com/og-cover.jpg" />
    <meta name="twitter:site" content="@AquaVia" />

    <!--
      Fonts were previously pulled in by an @import inside a JS-injected <style>
      block, so the browser did not discover them until the bundle had parsed and
      mounted — measured at ~1.67s. The preconnects were added in that same
      effect, which meant they resolved at the same moment and bought nothing.
      Static tags here put both on the critical path where they belong.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" />

      -->
