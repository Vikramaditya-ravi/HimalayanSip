<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/aquavia-mark.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      The SEO head below is REGENERATED at build time by scripts/prerender.mjs
      from ROUTES.resources in src/site/data.js — it strips these tags and writes
      its own, so the "must stay byte-identical" invariant the older route files
      document no longer has to be maintained by hand.

      They are still written out here because `vite dev` does not run the
      prerenderer: without them this route would serve an untitled document
      locally. Treat src/site/data.js as the source of truth and these as a dev
      convenience.

      There is deliberately no static fallback block inside #root, of the kind
      the older route files used to carry. Every route is prerendered now, so a
      non-executing crawler receives the real page; a hand-written parallel copy
      would be duplicate content inside the same document and would drift from
      the truth the moment a category was added.

      (The prerenderer asserts that no such block survives, and it does so with a
      plain substring scan of the finished file — so do not name the element here
      even in prose, or the build fails on this comment.)
    -->
    <title>Resources — Guides, Specs &amp; Buyer Answers | AquaVia</title>
    <meta name="description" content="Every AquaVia guide, specification and buyer answer in one place: costs, minimum orders, label materials, water standards, industry pages and city delivery details across Delhi NCR." />
    <meta name="keywords" content="branded water bottle guides, packaged drinking water resources, custom water bottle buyer guide, water bottle specifications India" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="AquaVia" />
    <meta name="theme-color" content="#080D16" />
    <link rel="canonical" href="https://www.aquaviaworld.com/resources" />

    <meta property="og:title" content="Resources — Guides, Specs &amp; Buyer Answers | AquaVia" />
    <meta property="og:description" content="Every AquaVia guide, specification and buyer answer in one place: costs, minimum orders, label materials, water standards, industry pages and city delivery details across Delhi NCR." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.aquaviaworld.com/resources" />
    <meta property="og:image" content="https://www.aquaviaworld.com/og-cover.jpg" />
    <meta property="og:site_name" content="AquaVia" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Resources — Guides, Specs &amp; Buyer Answers | AquaVia" />
    <meta name="twitter:description" content="Every AquaVia guide, specification and buyer answer in one place: costs, minimum orders, label materials, water standards, industry pages and city delivery details across Delhi NCR." />
    <meta name="twitter:image" content="https://www.aquaviaworld.com/og-cover.jpg" />
    <meta name="twitter:site" content="@AquaVia" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" />
  </head>
  <body style="margin:0;padding:0;background:#080D16;">
    <div id="root"></div>
    <script type="module" src="/src/entries/resources.jsx"></script>
  </body>
</html>
